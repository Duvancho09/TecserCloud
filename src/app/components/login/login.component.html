<div class="login-container">
    <!-- Imagen de la empresa en la parte izquierda -->
    <div class="image" [@fadeIn]>
        <div class="image-wrapper">
            <img src="assets/imgs/Tecsercloud.png" alt="Imagen de la empresa"/>
        </div>
    </div>

    <!-- Login para entrar a la pagina -->
    <div class="login-side" [@slideIn]>
        <mat-card class="header">
            <mat-card-header>
                <mat-card-title>INICIAR SESIÓN</mat-card-title>
            </mat-card-header>
            <mat-card-content class="form">
                <form [formGroup]="dataForm" (ngSubmit)="ingresar()">
                    <mat-form-field appearance="outline" class="width">
                        <mat-label>
                            <mat-icon>mail</mat-icon>
                            CORREO</mat-label>
                        <input matInput type="email" formControlName="correo" required/>
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="width">
                        <mat-label>
                            <mat-icon>lock</mat-icon>
                            CONTRASEÑA</mat-label>
                        <input matInput type="password" formControlName="contrasena" required/>
                    </mat-form-field>

                    <button mat-raised-button type="submit" class="btn">INGRESAR</button>
                </form>
            </mat-card-content>
        </mat-card>
        <div *ngIf="cargando" class="loading-message">
            <mat-progress-spinner mode="indeterminate" diameter="40" color="accent"></mat-progress-spinner>
            <p class="mensaje-cargando">Conectando con el servidor...</p>
        </div>
    </div>
</div>
